<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark light" />
    <!-- Theme before first paint (no flash): the saved choice, otherwise the system preference.
         Kept in step with src/design-system/theme.ts; theme-color matches each theme's base surface. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('interview-ai.theme');
          theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#F3F1E9' : '#0A0A0A';
      })();
    </script>
    <title>Component Library</title>
  </head>
  <body>
    <!-- Component library showcase. Development only: not part of the production build. -->
    <div id="showcase"></div>
    <script type="module" src="/src/design-system/showcase.tsx"></script>
  </body>
</html>
